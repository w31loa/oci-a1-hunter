[project]
name = "oci-a1-hunter"
version = "0.1.0"
description = "Keep retrying until Oracle Cloud gives you an Always Free Ampere A1 instance (4 OCPU / 24 GB)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["oracle", "oci", "oracle-cloud", "free-tier", "ampere", "a1", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "oci>=2.120",
    "typer>=0.12",
    "rich>=13",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
a1-hunter = "oci_a1_hunter.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oci_a1_hunter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long user-facing strings; the formatter handles code

[tool.pytest.ini_options]
testpaths = ["tests"]
