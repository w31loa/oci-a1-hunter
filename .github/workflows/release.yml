name: Release

# Push a tag like v0.2.0 -> standalone binaries for every platform are attached to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: a1-hunter-linux-x86_64 }
          - { os: ubuntu-24.04-arm, asset: a1-hunter-linux-arm64 }
          - { os: macos-latest, asset: a1-hunter-macos-arm64 }
          - { os: macos-15-intel, asset: a1-hunter-macos-x86_64 }
          - { os: windows-latest, asset: a1-hunter-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller --onefile --name a1-hunter --collect-data certifi packaging/entry.py
      - name: Smoke test
        run: ./dist/a1-hunter --version
      - name: Rename
        shell: bash
        run: |
          src=dist/a1-hunter; [ -f dist/a1-hunter.exe ] && src=dist/a1-hunter.exe
          mv "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.sh --generate-notes
